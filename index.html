<script>
(()=>{
const root=document.getElementById('tsukushi-preview');
const screen=root.querySelector('#ts-screen');
let page='home',confirmed=false,gameFilter='live',newsFilter='all',selectedDay=10,published=false,shareReported=false;
const icons={home:'house',schedule:'calendar-days',attendance:'clipboard-check',news:'bell',games:'trophy',more:'menu'};
const labels={home:'ホーム',schedule:'予定',attendance:'出欠',news:'お知らせ',games:'試合',more:'その他'};
const I=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
const tag=(t,c='')=>'<span class="ts-tag '+c+'">'+t+'</span>';
const go=(p,t,cls='ts-link')=>'<button type="button" class="'+cls+' cursor-interaction" data-go="'+p+'">'+t+'</button>';
const head=(title,sub,right='')=>'<div class="ts-pagehead"><div><small>'+sub+'</small><h1>'+title+'</h1></div>'+right+'</div>';
const allNav=()=>Object.keys(labels).map(k=>'<button type="button" data-go="'+k+'" class="cursor-interaction" aria-current="'+((page===k||(k==='news'&&page==='detail')||(k==='more'&&['family','compose','documents'].includes(page)))?'page':'false')+'">'+I(icons[k])+labels[k]+'</button>').join('');
const back=(p,t)=>go(p,I('arrow-left')+t,'ts-link ts-back');
function status(t){const n=root.querySelector('.ts-status');n.hidden=false;n.textContent=t;}
const eventHero=()=>'<div class="ts-hero"><div class="ts-row ts-between">'+tag('A・B・Cチーム')+'<span class="ts-muted">10月10日（土）</span></div><h2>週末合同練習</h2><div class="ts-info">'+I('clock')+'<strong>8:30 集合</strong><span>／ 9:00 開始</span></div><div class="ts-info">'+I('map-pin')+'東浅川少年球場</div><div class="ts-hero-footer"><span>陽斗・颯太の予定</span>'+go('detail','活動の案内 '+I('arrow-right'))+'</div></div>';
const announcementRows=()=>'<button type="button" class="ts-newsrow cursor-interaction" data-go="detail"><div><div class="ts-row">'+tag('重要変更','ts-orange')+'<span class="ts-muted">10/8 18:30 更新</span></div><h3>週末練習の集合時間が変わりました</h3><span class="ts-muted">全チーム · 第2版 · '+(confirmed?'確認済み':'確認が必要です')+'</span></div>'+I('chevron-right')+'</button><button type="button" class="ts-newsrow cursor-interaction" data-go="gear"><div><div class="ts-row">'+tag('持ち物')+'<span class="ts-muted">10/7</span></div><h3>秋の活動・持ち物のご案内</h3><span class="ts-muted">全チーム · 第1版</span></div>'+I('chevron-right')+'</button>';
function home(){return head('おかえりなさい。','山田さんのチームホーム')+(!confirmed?'<div class="ts-alert">'+I('circle-alert')+'<div><strong>集合時間が変更されています</strong><p>週末合同練習　8:00 → 8:30</p>'+go('detail','変更内容を確認 '+I('arrow-right'))+'</div></div>':'')+'<div class="ts-home-grid"><div><div class="ts-sectionhead"><h2>次の活動</h2>'+go('schedule','予定一覧')+'</div>'+eventHero()+'<div class="ts-panel"><h2>2か月先までの出欠</h2><p class="ts-muted" style="margin:12px 0">予定の登録を待たずに、日付ごとに回答できます。選手の出欠は全会員で共有します。</p>'+go('attendance','出欠ページを開く '+I('arrow-right'),'ts-primary ts-full')+'</div></div><div><div class="ts-sectionhead"><h2>お知らせ</h2>'+go('news','すべて')+'</div><div class="ts-panel">'+announcementRows()+'</div><div class="ts-panel"><h2>コーチ・保護者の兼任</h2><p class="ts-muted" style="margin:12px 0">現在のデモロール：'+(demoRole==='both'?'保護者 ＋ コーチ':demoRole==='coach'?'コーチ':'保護者')+'</p>'+go('more','ロール別の表示を試す')+'</div></div></div>';}
function news(){return head('お知らせ','必要な連絡を、いつでもここに。')+'<div class="ts-tabs"><button type="button" class="cursor-interaction" data-news="all" aria-pressed="'+(newsFilter==='all')+'">すべて</button><button type="button" class="cursor-interaction" data-news="unread" aria-pressed="'+(newsFilter==='unread')+'">未確認 '+(confirmed?'0':'1')+'</button></div><div class="ts-panel">'+(newsFilter==='unread'?(confirmed?'<div class="ts-success">'+I('check-check')+'確認が必要なお知らせはありません</div>':announcementRows().split('<button type="button" class="ts-newsrow cursor-interaction" data-go="gear">')[0]):announcementRows())+'</div>'+go('compose',I('square-pen')+'運営用・お知らせ作成','ts-secondary ts-full');}
function detail(){return back('news','お知らせ一覧')+'<div class="ts-panel"><div class="ts-row">'+tag('重要変更','ts-orange')+tag('全チーム')+'<span class="ts-muted">最新版 · 第2版</span></div><h1 class="ts-detail-title">週末練習の集合時間が<br>変わりました</h1><p class="ts-muted">連絡担当 · 10月8日 18:30 更新</p><div class="ts-change"><strong>変更されたのは、集合時間です</strong><div class="ts-change-time"><del>8:00</del>'+I('arrow-right')+'<span>8:30 集合</span></div><small>10月10日（土）／会場の変更はありません</small></div><p class="ts-bodycopy">グラウンドの利用時間に合わせて、集合を30分遅らせます。お間違えのないよう、変更後の時間をご確認ください。</p><dl class="ts-data"><dt>集合</dt><dd>10/10（土）8:30</dd><dt>練習開始</dt><dd>9:00</dd><dt>場所</dt><dd>東浅川少年球場</dd><dt>服装</dt><dd>練習着・帽子</dd><dt>持ち物</dt><dd>野球道具、水筒、タオル、上着</dd></dl>'+go('schedule',I('calendar-days')+'関連する予定を開く','ts-secondary ts-full')+'<hr class="ts-separator">'+(confirmed?'<div class="ts-success">'+I('circle-check')+'山田家は最新版を確認済みです</div>':'<button type="button" class="ts-primary ts-full cursor-interaction" data-action="confirm">'+I('check')+'変更内容を確認しました</button><p class="ts-muted" style="text-align:center;margin-top:9px">家庭内のどなたか1名が確認してください</p>')+'<details><summary>更新履歴を見る（2件）</summary><div class="ts-history"><p><strong>第2版 · 10/8 18:30</strong><br>集合時間を8:00から8:30に変更。再確認が必要です。</p><p><strong>第1版 · 10/6 19:00</strong><br>週末合同練習のお知らせを公開。<br><span class="ts-muted">過去の内容です。現在の集合は8:30です。</span></p></div></details></div><div class="ts-panel"><h2>このお知らせへの質問</h2><div class="ts-comment"><small class="ts-muted">保護者 · 10/8 19:00</small><p>終了予定は変わりませんか？</p></div><div class="ts-comment"><small class="ts-muted">連絡担当 · 10/8 19:10</small><p>終了は12:00の予定です。変更ありません。</p></div><form id="ts-comment-form"><label class="ts-field">質問・コメント<textarea name="comment" placeholder="このお知らせについて入力" required maxlength="300"></textarea></label><button class="ts-secondary ts-full cursor-interaction" type="submit">コメントを追加</button></form><div id="ts-local-comments"></div></div>';}
function schedule(){return head('予定','活動内容・集合場所を確認')+'<div class="ts-panel"><h2>活動予定サンプル</h2><p class="ts-muted" style="margin:12px 0">出欠は日付ごとの独立ページで登録します。予定を追加・変更しても出欠は自動変更されません。</p>'+go('attendance','出欠ページへ '+I('arrow-right'),'ts-secondary')+'</div>'+eventHero()+'<div class="ts-panel"><h3>午前練習</h3><p class="ts-muted">Cチーム · 散田小学校 · 9:00〜12:00</p><dl class="ts-data"><dt>服装</dt><dd>練習着・帽子</dd><dt>持ち物</dt><dd>野球道具・水筒・タオル</dd></dl></div>';}
function games(){return head('試合速報・結果','グラウンドの今を、家族にも。')+'<div class="ts-tabs"><button type="button" class="cursor-interaction" data-games="live" aria-pressed="'+(gameFilter==='live')+'">速報</button><button type="button" class="cursor-interaction" data-games="results" aria-pressed="'+(gameFilter==='results')+'">試合結果</button></div>'+(gameFilter==='results'?'<div class="ts-panel"><h2>試合結果サンプル</h2><div class="ts-result">'+tag('Aチーム')+'<span class="ts-muted">　10/4 · 練習試合</span><strong>つくしシャークスA　6 − 3　対戦チーム</strong><small class="ts-muted">結果確定 · 東浅川少年球場</small></div><div class="ts-result">'+tag('Cチーム')+'<span class="ts-muted">　10/3 · 練習試合</span><strong>つくしシャークスC　3 − 3　対戦チーム</strong><small class="ts-muted">結果確定 · 散田小学校</small></div></div>':'<div class="ts-home-grid"><div><div class="ts-scorebox"><div class="ts-row ts-between">'+tag('<span class="ts-inline-dot"></span>試合中・サンプル')+'<span class="ts-muted">練習試合</span></div><div class="ts-score-main"><div class="ts-teamname"><span class="ts-letter">S</span>つくし<br>シャークスA</div><div class="ts-score">4 − 2</div><div class="ts-teamname"><span class="ts-letter">T</span>対戦<br>チーム</div></div><p style="text-align:center;font-size:13px;margin-bottom:17px">4回表終了 · シャークスの攻撃へ</p><table class="ts-score-table"><thead><tr><th>TEAM</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>計</th></tr></thead><tbody><tr><td>対戦チーム</td><td>0</td><td>1</td><td>1</td><td>0</td><td>−</td><td>2</td></tr><tr><td>シャークスA</td><td>1</td><td>0</td><td>3</td><td>−</td><td>−</td><td>4</td></tr></tbody></table><p class="ts-muted" style="margin-top:13px;font-size:10px">最終更新 11:42　／　サンプル表示・自動更新なし</p></div><div class="ts-panel"><h3>試合情報</h3><dl class="ts-data"><dt>会場</dt><dd>東浅川少年球場</dd><dt>開始</dt><dd>10:30</dd><dt>試合区分</dt><dd>練習試合</dd></dl></div></div><div><div class="ts-sectionhead"><h2>試合の流れ</h2><span class="ts-muted">新しい順</span></div><div class="ts-panel">'+[['11:42','4回表終了','無失点で守り切り、攻撃へ。'],['11:30','3回裏 · 3得点','連打で逆転！ 4対2になりました。'],['11:15','3回表 · 1失点','1対2。ここから巻き返そう。']].map(x=>'<div class="ts-feed"><div class="ts-feed-time">'+x[0]+'</div><div class="ts-feed-text">'+tag(x[1])+'<p>'+x[2]+'</p></div></div>').join('')+'</div></div></div>');}
function family(){return back('more','その他')+head('山田家','家庭に紐づく選手と保護者')+'<div class="ts-panel"><h2>選手</h2><div class="ts-player-block"><div class="ts-person"><div class="ts-avatar">陽</div><div><h3>山田 陽斗</h3><small class="ts-muted">5年生 · Aチーム · 背番号 12</small></div></div></div><div class="ts-player-block"><div class="ts-person"><div class="ts-avatar">颯</div><div><h3>山田 颯太</h3><small class="ts-muted">3年生 · Cチーム · 背番号 24</small></div></div></div></div><div class="ts-panel"><h2>保護者</h2><div class="ts-settingrow"><span>山田 太郎</span>'+tag('ログイン中')+'</div><div class="ts-settingrow"><span>山田 花子</span>'+tag('登録済み','ts-neutral')+'</div><p class="ts-muted" style="margin-top:12px">お知らせの確認は、家庭内のどなたか1名で完了します。出欠ページで日付・選手ごとに回答します。</p></div>';}
function more(){return head('その他','家庭の管理とチームの資料')+'<div class="ts-panel"><h2>ロール切り替え（デモ専用）</h2><label class="ts-field">現在のユーザー<select data-demo-role>'+[['both','保護者 ＋ コーチ'],['parent','保護者のみ'],['coach','コーチのみ']].map(([v,t])=>'<option value="'+v+'" '+(demoRole===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label><p class="ts-muted">本番では管理者がロールを付与します。ここでは表示の違いを試せます。</p></div>'+'<div class="ts-panel"><button type="button" class="ts-settingrow cursor-interaction" data-go="family"><span>'+I('users')+'家庭・選手</span>'+I('chevron-right')+'</button><button type="button" class="ts-settingrow cursor-interaction" data-go="documents"><span>'+I('folder-open')+'チームの資料</span>'+I('chevron-right')+'</button></div><div class="ts-sectionhead"><h2>運営向け画面のサンプル</h2></div><div class="ts-panel"><button type="button" class="ts-settingrow cursor-interaction" data-go="compose"><span>'+I('square-pen')+'お知らせの作成・公開</span>'+I('chevron-right')+'</button><p class="ts-muted" style="margin-top:12px">実際のアプリでは、権限のある担当者だけに表示します。</p></div><div class="ts-panel"><h3>つくしシャークス</h3><p class="ts-muted" style="margin-top:10px">八王子市少年野球連盟加入<br>WESTリーグ所属<br>活動拠点：東浅川少年球場・散田小学校</p><p style="color:var(--ts-blue);font-weight:700;margin-top:18px">全力プレー、全力スマイル。</p></div>';}
function gear(){return back('news','お知らせ一覧')+'<div class="ts-panel">'+tag('持ち物')+'<h1 class="ts-detail-title">秋の活動・持ち物のご案内</h1><p class="ts-muted">10/7 公開 · 第1版 · サンプル</p><p class="ts-bodycopy" style="margin-top:24px">朝晩が涼しくなってきました。体温調節ができる上着をご用意ください。</p><dl class="ts-data"><dt>基本</dt><dd>グローブ・バット・帽子</dd><dt>飲み物</dt><dd>水筒</dd><dt>その他</dt><dd>タオル・着替え・上着</dd></dl></div>';}
function documents(){return back('more','その他')+head('チームの資料','必要な情報を、探しやすく。')+'<div class="ts-panel"><button type="button" class="ts-settingrow cursor-interaction" data-go="gear"><span>'+I('file-text')+'活動の持ち物</span>'+I('chevron-right')+'</button><div class="ts-settingrow"><span>'+I('file-text')+'チーム規約</span>'+tag('準備中','ts-neutral')+'</div></div>';}
function compose(){if(published)return back('more','その他')+head('お知らせを公開しました','運営用 · 公開後の画面サンプル')+'<div class="ts-success">'+I('circle-check')+'Webへの公開が完了しました（デモ）</div><div class="ts-panel"><h2>LINEは手動共有待ちです</h2><p class="ts-muted" style="margin:12px 0">無料枠の残り20通に対し、今回の送信対象は60人です。自動送信は停止しています。</p>'+tag('LINE料金 0円を維持','ts-green')+'<div class="ts-notify-preview">【予定変更】週末の活動予定を更新しました。\n集合時刻を変更しています。最新版をご確認ください。\n［お知らせへの固定URL］</div><p class="ts-muted">実際のアプリでは、ここからLINEを開いて送信先を選べます。</p><button type="button" class="ts-secondary ts-full cursor-interaction" data-action="share-demo" style="margin-top:14px">'+I('send')+'LINE共有の流れを見る</button><div id="ts-share-help"></div><button type="button" class="ts-primary ts-full cursor-interaction" data-action="share-report" style="margin-top:10px">'+(shareReported?'手動共有の記録済み（デモ）':'手動で共有したことを記録')+'</button></div>';return back('more','その他')+head('お知らせを作成','運営用 · 公開前の確認まで試せます')+'<form id="ts-compose-form"><div class="ts-form-grid"><div class="ts-panel"><h2>お知らせの内容</h2><label class="ts-field">タイトル<input name="title" required value="週末練習の集合時間変更" maxlength="80"></label><label class="ts-field">対象<select name="audience"><option>全チーム</option><option>Aチーム</option><option>Bチーム</option><option>Cチーム</option></select></label><label class="ts-field">本文<textarea name="body" required>10月10日（土）の集合時間を8:30に変更します。会場は東浅川少年球場です。</textarea></label><label class="ts-check"><input type="checkbox" checked>家庭ごとの確認をお願いする</label></div><div class="ts-panel"><h2>公開・LINE通知</h2><dl class="ts-data"><dt>Webの対象</dt><dd>選択したチーム</dd><dt>LINE通知先</dt><dd>全体連絡グループ</dd><dt>無料枠残り</dt><dd>20通 <span class="ts-muted">/ 200通</span></dd><dt>今回の対象</dt><dd>60人</dd></dl><div class="ts-alert"><div><strong>無料枠に収まりません</strong><p>Webに公開後、担当者がLINEで共有してください。自動送信・追加課金はしません。</p></div></div><p class="ts-muted" style="margin-bottom:16px">LINEには個人情報を載せず、更新案内とWebへのリンクだけを共有します。</p><button type="submit" class="ts-primary ts-full cursor-interaction">Webに公開して、共有へ '+I('arrow-right')+'</button></div></div></form>';}
const jstParts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const part=t=>Number(jstParts.find(p=>p.type===t).value);
const dayKey=d=>d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
const startDate=new Date(Date.UTC(part('year'),part('month')-1,part('day')));
const endMonth=new Date(Date.UTC(startDate.getUTCFullYear(),startDate.getUTCMonth()+3,0));
const endDate=new Date(Date.UTC(startDate.getUTCFullYear(),startDate.getUTCMonth()+2,Math.min(startDate.getUTCDate(),endMonth.getUTCDate())));
const startKey=dayKey(startDate),endKey=dayKey(endDate);
const monthKeys=[];for(let d=new Date(Date.UTC(startDate.getUTCFullYear(),startDate.getUTCMonth(),1));d<=endDate;d.setUTCMonth(d.getUTCMonth()+1))monthKeys.push(dayKey(d).slice(0,7));
let attTab='player-register',monthIndex=0,viewDate=startKey,teamFilter='A',demoRole='both';
const people=[{id:'haruto',name:'山田 陽斗',team:'A',own:true},{id:'a2',name:'佐藤 蓮',team:'A'},{id:'b1',name:'鈴木 湊',team:'B'},{id:'b2',name:'高橋 陸',team:'B'},{id:'sota',name:'山田 颯太',team:'C',own:true},{id:'c2',name:'田中 悠',team:'C'}];
const coaches=[{id:'me',name:'山田 太郎',team:'A'},{id:'coach2',name:'佐藤 健',team:'B'},{id:'coach3',name:'田中 誠',team:'C'}];
const answerValues=['未回答','参加','欠席','未定'];const savedAnswers={},draftAnswers={};
const canCoach=()=>demoRole==='both'||demoRole==='coach';const canParent=()=>demoRole==='both'||demoRole==='parent';
const allowedDate=k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&k>=startKey&&k<=endKey&&dayKey(new Date(k+'T00:00:00Z'))===k;
const answerKey=(kind,id,date)=>[kind,id,date].join('|');
function savedValue(kind,id,date){const key=answerKey(kind,id,date);if(Object.hasOwn(savedAnswers,key))return savedAnswers[key];if(id==='me'||people.some(p=>p.id===id&&p.own))return '未回答';return answerValues[(Number(date.slice(-2))+id.length)%4];}
function editValue(kind,id,date){const key=answerKey(kind,id,date);return Object.hasOwn(draftAnswers,key)?draftAnswers[key]:savedValue(kind,id,date);}
function mayEdit(kind,id){return kind==='player'?canParent()&&people.some(p=>p.id===id&&p.own):canCoach()&&id==='me';}
function datesOfMonth(){const [y,m]=monthKeys[monthIndex].split('-').map(Number),days=[];for(let d=new Date(Date.UTC(y,m-1,1));d.getUTCMonth()===m-1;d.setUTCDate(d.getUTCDate()+1)){const k=dayKey(d);if(allowedDate(k))days.push(k);}return days;}
const dayLabel=k=>{const d=new Date(k+'T00:00:00Z');return Number(k.slice(5,7))+'/'+Number(k.slice(8))+'（'+['日','月','火','水','木','金','土'][d.getUTCDay()]+'）';};
function dateControl(){return '<label class="ts-field">確認日<input type="date" data-att-date min="'+startKey+'" max="'+endKey+'" value="'+viewDate+'"></label>';}
function registration(kind){const isCoach=kind==='coach';if(isCoach?!canCoach():!canParent())return '<div class="ts-panel"><h2>このロールでは登録できません</h2><p class="ts-muted">'+(isCoach?'コーチロールが必要です。':'保護者ロールと自家庭の選手の紐づけが必要です。')+'</p></div>';
const members=isCoach?[coaches[0]]:people.filter(p=>p.own),dates=datesOfMonth();
return '<div class="ts-panel"><div class="ts-row ts-between"><h2>'+monthKeys[monthIndex].replace('-','年')+'月</h2><div class="ts-row"><button class="ts-secondary cursor-interaction" type="button" data-month="-1" '+(monthIndex===0?'disabled':'')+' aria-label="前月">前月</button><button class="ts-secondary cursor-interaction" type="button" data-month="1" '+(monthIndex===monthKeys.length-1?'disabled':'')+' aria-label="翌月">翌月</button></div></div><p class="ts-muted" style="margin:12px 0">'+(isCoach?'自分のコーチ出欠を登録します。コーチ同士に共有されます。':'自家庭の選手のみ編集できます。出欠はチーム内の全会員に共有されます。')+'</p><div class="ts-att-tablewrap"><table class="ts-att-table"><thead><tr><th>日付</th>'+members.map(p=>'<th>'+p.name+'<small>'+p.team+'チーム</small></th>').join('')+'</tr></thead><tbody>'+dates.map(date=>'<tr><th scope="row">'+dayLabel(date)+'</th>'+members.map(p=>'<td><select aria-label="'+date+' '+p.name+'の出欠" data-att-kind="'+kind+'" data-att-id="'+p.id+'" data-att-day="'+date+'">'+answerValues.map(v=>'<option '+(v===editValue(kind,p.id,date)?'selected':'')+'>'+v+'</option>').join('')+'</select></td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="ts-att-save"><button type="button" class="ts-primary ts-full cursor-interaction" data-save-att="'+kind+'">'+I('check')+'この月の回答を保存</button><small class="ts-muted">保存すると一覧にも反映されます。再読み込みでリセットされるデモです。</small></div></div>';}
function overview(kind){const isCoach=kind==='coach';if(isCoach&&!canCoach())return '<div class="ts-panel"><h2>コーチの出欠はコーチ限定です</h2><p class="ts-muted">保護者ロールだけでは閲覧できません。</p></div>';
const rows=isCoach?coaches:people.filter(p=>p.team===teamFilter),counts=Object.fromEntries(answerValues.map(v=>[v,rows.filter(p=>savedValue(kind,p.id,viewDate)===v).length]));
return '<div class="ts-panel"><h2>'+(isCoach?'コーチの出欠一覧':'選手の出欠一覧')+'</h2><p class="ts-muted" style="margin-top:7px">'+(isCoach?'コーチロールのあるユーザーだけが閲覧できます。':'チーム内の全会員が、全チームの出欠を閲覧できます。')+'</p>'+dateControl()+(!isCoach?'<div class="ts-tabs" aria-label="チーム別の出欠">'+['A','B','C'].map(t=>'<button type="button" class="cursor-interaction" data-att-team="'+t+'" aria-pressed="'+(teamFilter===t)+'">'+t+'チーム</button>').join('')+'</div>':'')+'<div class="ts-row" style="margin-bottom:16px">'+answerValues.map(v=>tag(v+' '+counts[v]+'名',v==='参加'?'ts-green':v==='未回答'?'ts-orange':'ts-neutral')).join('')+'</div><div class="ts-att-tablewrap"><table class="ts-att-table"><thead><tr><th>'+(isCoach?'コーチ':'選手')+'</th><th>所属</th><th>出欠</th></tr></thead><tbody>'+rows.map(p=>'<tr><th scope="row">'+p.name+'</th><td>'+p.team+'</td><td>'+tag(savedValue(kind,p.id,viewDate),savedValue(kind,p.id,viewDate)==='参加'?'ts-green':'ts-neutral')+'</td></tr>').join('')+'</tbody></table></div></div>';}
function attendancePage(){const tabs=[...(canParent()?[['player-register','選手の登録']]:[]),['player-view','選手の一覧'],...(canCoach()?[['coach-register','コーチの登録'],['coach-view','コーチの一覧']]:[])];
return head('出欠','予定に関係なく、日付ごとに登録')+'<div class="ts-panel"><div class="ts-row">'+tag('登録期間')+'<strong>'+startKey.replaceAll('-','/')+' 〜 '+endKey.replaceAll('-','/')+'</strong></div><p class="ts-muted" style="margin-top:8px">今日から2か月後の同日まで。平日も登録できます。<br>現在のロール：'+(demoRole==='both'?'保護者 ＋ コーチ':demoRole==='coach'?'コーチ':'保護者')+'</p></div><div class="ts-tabs">'+tabs.map(([id,t])=>'<button type="button" class="cursor-interaction" data-att-tab="'+id+'" aria-pressed="'+(attTab===id)+'">'+t+'</button>').join('')+'</div>'+(attTab==='player-register'?registration('player'):attTab==='player-view'?overview('player'):attTab==='coach-register'?registration('coach'):overview('coach'));}
function attendanceHandlers(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.attTab){if(b.dataset.attTab.startsWith('coach')&&!canCoach())return;attTab=b.dataset.attTab;render();}if(b.dataset.month){monthIndex=Math.max(0,Math.min(monthKeys.length-1,monthIndex+Number(b.dataset.month)));render();}if(b.dataset.attTeam){if(!['A','B','C'].includes(b.dataset.attTeam))return;teamFilter=b.dataset.attTeam;render();}if(b.dataset.saveAtt){const kind=b.dataset.saveAtt;let count=0;for(const date of datesOfMonth())for(const id of kind==='coach'?['me']:people.filter(p=>p.own).map(p=>p.id)){if(!mayEdit(kind,id)||!allowedDate(date))continue;const k=answerKey(kind,id,date);if(Object.hasOwn(draftAnswers,k)){savedAnswers[k]=draftAnswers[k];delete draftAnswers[k];count++;}}render();status(count?'変更した'+count+'件を保存し、出欠一覧に反映しました（デモ）':'変更された回答はありません。');}}
root.addEventListener('click',attendanceHandlers);
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.attKind){if(!mayEdit(el.dataset.attKind,el.dataset.attId)||!allowedDate(el.dataset.attDay)||!answerValues.includes(el.value))return;draftAnswers[answerKey(el.dataset.attKind,el.dataset.attId,el.dataset.attDay)]=el.value;}if(el.hasAttribute('data-att-date')){if(!allowedDate(el.value)){status('登録期間内の日付を選択してください。');return;}viewDate=el.value;render();}if(el.hasAttribute('data-demo-role')){if(!['both','parent','coach'].includes(el.value))return;demoRole=el.value;attTab=canParent()?'player-register':'coach-register';render();}});

const pages={home,news,detail,schedule,attendance:attendancePage,games,family,more,gear,documents,compose};
function render(){screen.innerHTML=(pages[page]||home)();root.querySelector('.ts-side-nav').innerHTML=allNav();root.querySelector('.ts-bottom-nav').innerHTML=allNav();root.querySelector('#ts-breadcrumb').textContent=labels[page]||({detail:'お知らせ詳細',attendance:'出欠回答',family:'家庭・選手',compose:'お知らせ作成',gear:'持ち物',documents:'資料'}[page]);if(window.lucide)window.lucide.createIcons({attrs:{width:19,height:19}});}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go;root.querySelector('.ts-status').hidden=true;render();window.scrollTo({top:0,behavior:'instant'});return;}if(b.dataset.news){newsFilter=b.dataset.news;render();return;}if(b.dataset.games){gameFilter=b.dataset.games;render();return;}if(b.dataset.day){selectedDay=Number(b.dataset.day);render();return;}switch(b.dataset.action){case'confirm':confirmed=true;render();status('山田家の最新版確認を記録しました（この画面内のデモ）');break;case'share-demo':root.querySelector('#ts-share-help').innerHTML='<div class="ts-notify-preview">1. LINEの送信先選択を開く<br>2. 全体連絡グループを選ぶ<br>3. 内容を確認して送信する<br><small>この見本ではLINEを開かず、送信しません。</small></div>';break;case'share-report':shareReported=true;b.textContent='手動共有の記録済み（デモ）';status('担当者の申告として記録しました。実際のLINE送信は行っていません。');break;}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ts-compose-form'){published=true;render();status('デモ画面内で公開しました。外部への保存・送信は行っていません。');}if(e.target.id==='ts-comment-form'){const text=new FormData(e.target).get('comment');const container=root.querySelector('#ts-local-comments');const item=document.createElement('p');item.className='ts-comment';item.textContent='山田さん：'+text;container.appendChild(item);e.target.reset();status('コメントを追加しました（デモ）');}});
render();
})();
</script>
