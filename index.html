<script>
(()=>{
const root=document.getElementById('tsukushi-preview');
const screen=root.querySelector('#ts-screen');
let page='home',confirmed=false,gameFilter='live',newsFilter='all',selectedDay=10,published=false,shareReported=false;
const icons={home:'house',schedule:'calendar-days',attendance:'clipboard-check',news:'bell',games:'trophy',more:'menu'};
const labels={home:'ホーム',schedule:'予定',attendance:'出欠',news:'お知らせ',games:'試合',more:'その他'};
const I=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
const tag=(t,c='')=>'<span class="ts-tag '+c+'">'+t+'</span>';
const go=(p,t,cls='ts-link')=>'<button type="button" class="'+cls+' cursor-interaction" data-go="'+p+'">'+t+'</button>';
const head=(title,sub,right='')=>'<div class="ts-pagehead"><div><small>'+sub+'</small><h1>'+title+'</h1></div>'+right+'</div>';
const allNav=()=>Object.keys(labels).map(k=>'<button type="button" data-go="'+k+'" class="cursor-interaction" aria-current="'+((page===k||(k==='news'&&['detail','postedNewsView'].includes(page))||(k==='schedule'&&['eventForm','eventView'].includes(page))||(k==='more'&&['family','compose','documents'].includes(page)))?'page':'false')+'">'+I(icons[k])+labels[k]+'</button>').join('');
const back=(p,t)=>go(p,I('arrow-left')+t,'ts-link ts-back');
function status(t){const n=root.querySelector('.ts-status');n.hidden=false;n.textContent=t;}
const eventHero=()=>{const next=[...scheduleEvents].filter(e=>e.date>=startKey&&!['中止','延期','終了'].includes(e.state)&&e.teams.some(t=>relevantTeam(t).length)).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start))[0];return next?'<div class="ts-panel"><h3 style="margin-bottom:16px">2026年 '+dayLabel(next.date)+'</h3>'+scheduleCard(next)+'</div>':'<div class="ts-panel"><p>次の活動はまだ登録されていません。</p>'+go('schedule','チーム全体の予定へ')+'</div>';};
const announcementRows=()=>(postedNews?'<button type="button" class="ts-newsrow" data-go="postedNewsView"><div>'+tag('新しいお知らせ')+'<h3>'+esc(postedNews.title)+'</h3><span class="ts-muted">'+esc(postedNews.audience)+'</span></div></button>':'')+'<button type="button" class="ts-newsrow cursor-interaction" data-go="detail"><div><div class="ts-row">'+tag('重要変更','ts-orange')+'<span class="ts-muted">10/8 18:30 更新</span></div><h3>週末練習の集合時間が変わりました</h3><span class="ts-muted">全チーム · 第2版 · '+(confirmed?'確認済み':'確認が必要です')+'</span></div>'+I('chevron-right')+'</button><button type="button" class="ts-newsrow cursor-interaction" data-go="gear"><div><div class="ts-row">'+tag('持ち物')+'<span class="ts-muted">10/7</span></div><h3>秋の活動・持ち物のご案内</h3><span class="ts-muted">全チーム · 第1版</span></div>'+I('chevron-right')+'</button>';

function render(){screen.innerHTML=(pages[page]||home)();root.querySelector('.ts-side-nav').innerHTML=allNav();root.querySelector('.ts-bottom-nav').innerHTML=allNav();root.querySelector('#ts-breadcrumb').textContent=labels[page]||({eventForm:'予定登録・編集',eventView:'予定詳細',postedNewsView:'お知らせ詳細',detail:'お知らせ詳細',attendance:'出欠回答',family:'家庭・選手',compose:'お知らせ作成',gear:'持ち物',documents:'資料'}[page]);if(window.lucide)window.lucide.createIcons({attrs:{width:19,height:19}});}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go;root.querySelector('.ts-status').hidden=true;render();window.scrollTo({top:0,behavior:'instant'});return;}if(b.dataset.news){newsFilter=b.dataset.news;render();return;}if(b.dataset.games){gameFilter=b.dataset.games;render();return;}if(b.dataset.day){selectedDay=Number(b.dataset.day);render();return;}switch(b.dataset.action){case'confirm':confirmed=true;render();status('山田家の最新版確認を記録しました（この画面内のデモ）');break;case'share-demo':root.querySelector('#ts-share-help').innerHTML='<div class="ts-notify-preview">1. LINEの送信先選択を開く<br>2. 全体連絡グループを選ぶ<br>3. 内容を確認して送信する<br><small>この見本ではLINEを開かず、送信しません。</small></div>';break;case'share-report':shareReported=true;b.textContent='手動共有の記録済み（デモ）';status('担当者の申告として記録しました。実際のLINE送信は行っていません。');break;}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ts-compose-form'){const fd=new FormData(e.target);postedNews={title:String(fd.get('title')||''),body:String(fd.get('body')||''),audience:String(fd.get('audience')||'')};recentUpdates.unshift({at:new Date().toISOString(),type:'お知らせ追加',title:postedNews.title,summary:postedNews.audience,target:'postedNewsView'});published=true;render();status('デモ画面内で公開しました。外部への保存・送信は行っていません。');}if(e.target.id==='ts-comment-form'){const text=new FormData(e.target).get('comment');const container=root.querySelector('#ts-local-comments');const item=document.createElement('p');item.className='ts-comment';item.textContent='山田さん：'+text;container.appendChild(item);e.target.reset();status('コメントを追加しました（デモ）');}});
render();
})();
</script>

<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js" onload="lucide.createIcons({attrs:{width:19,height:19}})"></script>
